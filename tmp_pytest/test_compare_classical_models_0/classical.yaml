dataset:
  combine_title_text: false
  drop_missing_text: true
  label_column: label
  path: C:\Users\Lenovo\Desktop\Fake-news-detection\data\sample\sample_news.csv
  text_column: text
  title_column: null
  version: WELFake_Dataset.csv
deployment:
  fake_threshold: 0.5
  model_name: svm
  uncertain_band:
  - 0.35
  - 0.65
features:
  max_df: 0.9
  max_features: 10000
  min_df: 1
  ngram_range:
  - 1
  - 2
  sublinear_tf: true
  type: tfidf
logging:
  format: '%(asctime)s | %(levelname)s | %(name)s | %(message)s'
  level: INFO
model:
  class_weight: balanced
  random_state: 42
model_configs:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  naive_bayes:
    alpha: 1.0
  random_forest:
    max_depth: 30
    n_estimators: 100
  svm:
    C: 1.0
    calibrate: true
    calibration_cv: 5
    calibration_method: sigmoid
    max_iter: 3000
  xgboost:
    device: cpu
    learning_rate: 0.1
    max_depth: 6
    n_estimators: 150
    tree_method: hist
models:
- logistic_regression
- naive_bayes
output:
  classifier_filename: classifier.joblib
  comparison_csv: model_comparison.csv
  comparison_json: model_comparison.json
  metadata_filename: metadata.json
  metrics_filename: metrics.json
  model_dir: C:\Users\Lenovo\Desktop\Fake-news-detection\tmp_pytest\test_compare_classical_models_0\models
  vectorizer_filename: tfidf_vectorizer.joblib
preprocessing:
  lowercase: true
  min_text_length: 10
  remove_html: true
  remove_urls: true
  strip_datelines: true
training:
  deduplicate: true
  random_state: 42
  stratify: true
  test_size: 0.2
